<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>

    <style>
        body{
            font-family: Arial;
            margin: 40px;
        }

        table{
            width: 100%;
            border-collapse: collapse;
        }

        th, td{
            border: 1px solid #ddd;
            padding: 10px;
            text-align: left;
        }

        th{
            background: #f2f2f2;
        }

        .pending{
            color: orange;
            font-weight: bold;
        }

        .approved{
            color: green;
            font-weight: bold;
        }

        .rejected{
            color: red;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h2>
        Recent Alerts
    </h2>

    <table>
        <thead>
            <tr>
                <th>Timestamp</th>
                <th>Alert Type</th>
                <th>Technique</th>
                <th>Confidence</th>
                <th>Status</th>
                <th>Review</th>
            </tr>
        </thead>
        <tbody id="tableBody"></tbody>
    </table>

    <script src="dashboard.js"></script>
    
</body>
</html>
